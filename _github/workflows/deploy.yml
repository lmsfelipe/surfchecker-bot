name: Deploy to VPS
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        run: |
          curl -X POST "${{ secrets.PORTAINER_URL }}/api/stacks/${{ secrets.STACK_ID }}/git/redeploy" \
            -H "Authorization: Bearer ${{ secrets.PORTAINER_TOKEN }}"
